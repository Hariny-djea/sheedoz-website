<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sheedoz - App Store</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #f8f1ed;
      --brown: #4b2e2a;
      --terracotta: #d6724a;
      --text: #6b5750;
      --border: rgba(214, 114, 74, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      padding: 28px;
      box-shadow: 0 14px 32px rgba(75, 46, 42, 0.12);
    }

    .brand {
      margin: 0 0 18px;
      color: var(--terracotta);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      color: var(--brown);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 8vw, 38px);
      line-height: 1.08;
    }

    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.55;
    }

    .primary {
      min-height: 48px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      background: var(--terracotta);
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Sheedoz</p>
    <h1>Redirection vers l'App Store</h1>
    <p id="message">On enregistre le clic Creator, puis on ouvre directement la page App Store de Sheedoz.</p>
    <a class="primary" id="install-app" href="https://apps.apple.com/fr/app/sheedoz/id6760241820?uo=4" hidden>Télécharger Sheedoz</a>
  </main>

  <script>
    (function () {
      var SUPABASE_URL = 'https://khbnsidleqhuobcnmxte.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYm5zaWRsZXFodW9iY25teHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUxNzMyNTEsImV4cCI6MjA2MDc0OTI1MX0.h5R_bTQKHUZfJp2m4gab0GLQjk-ZWxPtQBNE4jloz-E';
      var APP_STORE_URL = 'https://apps.apple.com/fr/app/sheedoz/id6760241820?uo=4';
      var message = document.getElementById('message');
      var installApp = document.getElementById('install-app');

      function sanitizeCreatorSlug(value) {
        var normalized = String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/^@+/, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .replace(/-{2,}/g, '-')
          .slice(0, 64);

        return normalized.length >= 3 ? normalized : '';
      }

      function readSlug() {
        var match = window.location.pathname.match(/^\/c\/([^/?#]+)/);
        return match && match[1] ? sanitizeCreatorSlug(decodeURIComponent(match[1])) : '';
      }

      async function recordClick(slug) {
        var url = new URL(SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/growth-click');
        url.searchParams.set('slug', slug);
        url.searchParams.set('format', 'json');

        var response = await fetch(url.toString(), {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON,
            authorization: 'Bearer ' + SUPABASE_ANON,
            'content-type': 'application/json',
            accept: 'application/json'
          },
          body: JSON.stringify({ destination: 'app_store' })
        });

        var data = await response.json().catch(function () { return null; });
        if (!response.ok || !data || !data.ok) {
          throw new Error((data && data.error) || 'Creator click unavailable');
        }
      }

      function redirectToAppStore() {
        window.location.replace(APP_STORE_URL);
        window.setTimeout(function () {
          message.textContent = "Si la redirection ne s'est pas lancée, touche le bouton ci-dessous.";
          installApp.hidden = false;
        }, 1200);
      }

      async function run() {
        var slug = readSlug();

        if (slug) {
          try {
            await recordClick(slug);
          } catch (error) {
            // Do not block acquisition: the App Store redirect must remain immediate even if tracking fails.
          }
        }

        redirectToAppStore();
      }

      run();
    })();
  </script>
</body>
</html>

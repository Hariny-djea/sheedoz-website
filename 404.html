<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sheedoz - App Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --cream: #F8F1ED;
      --brown: #4B2E2A;
      --terracotta: #D6724A;
      --terracotta-dark: #B05A38;
      --text: #6B5750;
      --muted: #8A746D;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      min-height: 100svh;
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: calc(100svh - max(28px, env(safe-area-inset-top)) - max(28px, env(safe-area-inset-bottom)));
      text-align: center;
    }

    .brand {
      margin: 0 0 18px;
      color: var(--terracotta);
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--brown);
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 24px;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 400;
    }

    .primary {
      min-height: 48px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 280px;
      padding: 12px 18px;
      background: var(--terracotta);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(214, 114, 74, 0.18);
    }

    .primary:active {
      background: var(--terracotta-dark);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Sheedoz</p>
    <h1>Ouverture de Sheedoz</h1>
    <p id="message">Un instant, on te redirige vers l'App Store.</p>
    <a class="primary" id="install-app" href="https://apps.apple.com/fr/app/sheedoz/id6760241820?uo=4" hidden>Ouvrir l'App Store</a>
  </main>

  <script>
    (function () {
      var SUPABASE_URL = 'https://khbnsidleqhuobcnmxte.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYm5zaWRsZXFodW9iY25teHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUxNzMyNTEsImV4cCI6MjA2MDc0OTI1MX0.h5R_bTQKHUZfJp2m4gab0GLQjk-ZWxPtQBNE4jloz-E';
      var APP_STORE_URL = 'https://apps.apple.com/fr/app/sheedoz/id6760241820?uo=4';
      var message = document.getElementById('message');
      var installApp = document.getElementById('install-app');

      function sanitizeCreatorSlug(value) {
        var normalized = String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/^@+/, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .replace(/-{2,}/g, '-')
          .slice(0, 64);

        return normalized.length >= 3 ? normalized : '';
      }

      function readSlug() {
        var match = window.location.pathname.match(/^\/c\/([^/?#]+)/);
        return match && match[1] ? sanitizeCreatorSlug(decodeURIComponent(match[1])) : '';
      }

      async function recordClick(slug) {
        var url = new URL(SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/growth-click');
        url.searchParams.set('slug', slug);
        url.searchParams.set('format', 'json');

        var response = await fetch(url.toString(), {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON,
            authorization: 'Bearer ' + SUPABASE_ANON,
            'content-type': 'application/json',
            accept: 'application/json'
          },
          body: JSON.stringify({ destination: 'app_store' })
        });

        var data = await response.json().catch(function () { return null; });
        if (!response.ok || !data || !data.ok) {
          throw new Error((data && data.error) || 'Creator click unavailable');
        }
      }

      function redirectToAppStore() {
        window.location.replace(APP_STORE_URL);
        window.setTimeout(function () {
          message.textContent = "Si la redirection ne s'est pas lancée, touche le bouton ci-dessous.";
          installApp.hidden = false;
        }, 1200);
      }

      async function run() {
        var slug = readSlug();

        if (slug) {
          try {
            await recordClick(slug);
          } catch (error) {
            // Do not block acquisition: the App Store redirect must remain immediate even if tracking fails.
          }
        }

        redirectToAppStore();
      }

      run();
    })();
  </script>
</body>
</html>
